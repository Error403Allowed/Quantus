data:
  tickers:
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - META
    - NVDA
    - JPM
    - JNJ
    - XOM
    - PG
  period: "5y"
  interval: "1d"

features:
  lookback: 10
  horizon: 5
  drop_columns:
    - Open
    - High
    - Low
    - Close
    - Volume
    - Future_Return
    - Target

split:
  train_ratio: 0.6
  val_ratio: 0.2

alpha:
  hidden1: 64
  hidden2: 32
  dropout: 0.3
  output_dim: 3

training:
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 1000
  patience: 50

paths:
  alpha_dir: "models/alpha/weights"
  model_path: "models/alpha/weights/stock_classifier.pt"
  scaler_path: "models/alpha/weights/scaler.pkl"
  temperature_path: "models/alpha/weights/temperature.pt"
